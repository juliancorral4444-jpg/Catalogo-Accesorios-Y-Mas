<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALE&LIA Accesorios y mas...</title>
<style>
body{font-family:Arial;background:#fff0f6;margin:0}
header{background:white;text-align:center;padding:25px;box-shadow:0 2px 10px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
header h1{margin:0;letter-spacing:3px}header h1 span{color:#e91e63}
.tienda{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px;max-width:1000px;margin:20px auto;padding:15px}
.card{background:white;border-radius:15px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative}
.card.agotado{opacity:.5;filter:grayscale(1)}
.card img{width:100%;height:170px;object-fit:cover;border-radius:10px}
.badge{position:absolute;top:10px;left:10px;padding:4px 8px;border-radius:10px;font-size:11px;color:white;font-weight:bold}
.badge-agotado{background:#333}.badge-pedido{background:#ff9800}.badge-disponible{background:#4caf50}
.precio{color:#e91e63;font-weight:bold;font-size:18px;margin:5px 0}.material{font-size:11px;color:#999}
.card button{background:#e91e63;color:white;border:none;padding:9px;border-radius:20px;width:100%;margin-top:8px;cursor:pointer}
.card button:disabled{background:#ccc}
#carrito{position:fixed;bottom:15px;right:15px;background:white;padding:15px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.2);width:280px}
</style>
</head>
<body>
<header><h1><span>VALE&LIA</span> Accesorios y mas...</h1></header>
<div class="tienda" id="tienda">Cargando joyería...</div>
<div id="carrito"><h3 style="margin:0">🛒 Carrito</h3><div id="lista-carrito" style="font-size:13px;margin:5px 0">Vacío</div><div id="total" style="font-weight:bold">Total: $0</div><button onclick="mandarWhats()" style="background:#25D366;color:white;border:none;padding:12px;width:100%;border-radius:10px;margin-top:10px;font-weight:bold;cursor:pointer">Pedir por WhatsApp</button></div>
<script>
const BIN_ID="6ade92ceac6210605a51659c";
const API_KEY="$2a$10$BHdEFL3G9QNR1VbRAXpJ.dwX7sgzGUata6vJIIhg/I8fUrVlYS.u";
const API_URL=`https://api.jsonbin.io/v3/b/${BIN_ID}`;
const WHATS="526391776566";
let productos=[],carrito=[],total=0;
async function cargar(){
 let r=await fetch(`${API_URL}/latest`,{headers:{"X-Master-Key":API_KEY}});
 let j=await r.json(); let data=j.record;
 productos = data.productos || (Array.isArray(data)?data:[]);
 render();
}
function render(){
 let c=document.getElementById('tienda');c.innerHTML="";
 if(productos.length==0){c.innerHTML="<p>No hay productos aún, ve al admin</p>";return}
 productos.forEach(p=>{
  c.innerHTML+=`<div class="card ${p.estado=='agotado'?'agotado':''}"><div class="badge badge-${p.estado}">${p.estado.toUpperCase()}</div><img src="${p.foto}"><h3 style="font-size:14px;margin:8px 0 2px">${p.nombre}</h3><div class="material">${p.material||''}</div><div class="precio">$${p.precio}</div><button ${p.estado=='agotado'?'disabled':''} onclick="agregar(${p.id})">${p.estado=='agotado'?'Agotado':'Agregar'}</button></div>`;
 });
}
function agregar(id){let p=productos.find(x=>x.id==id);carrito.push(p);total+=parseInt(p.precio);act();}
function act(){document.getElementById('lista-carrito').innerHTML=carrito.length==0?"Vacío":carrito.map(x=>`• ${x.nombre} $${x.precio}`).join('<br>');document.getElementById('total').innerText=`Total: $${total}`;}
function mandarWhats(){if(carrito.length==0)return alert("Carrito vacío");let msg="Hola VALE&LIA! Quiero:%0A"+carrito.map(c=>`- ${c.nombre} $${c.precio}`).join('%0A')+`%0ATotal: $${total}`;window.open(`https://wa.me/${WHATS}?text=${msg}`,'_blank');carrito=[];total=0;act();}
cargar();
</script>
</body>
</html>
