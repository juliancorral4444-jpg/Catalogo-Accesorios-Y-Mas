<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VALE & LIA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Poppins:wght@300;400;600&display=swap');
body{margin:0;background:#ffeef2;font-family:'Poppins',sans-serif;color:#4a2a2a}
.header{background:#ffeaef;padding:38px 15px 22px;text-align:center;border-bottom:1px solid #ffd6dd}
.header h1{font-family:'Cormorant Garamond',serif;letter-spacing:10px;font-size:36px;margin:0;color:#4a2a2a;font-weight:500}
.header .sub{letter-spacing:6px;font-size:11px;color:#8a6a6a;margin:6px 0 14px;text-transform:lowercase}
.header .slogan{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:3px;line-height:1.6}
.menu-btn{position:fixed;top:15px;left:15px;z-index:99;background:#fff;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0001;font-size:22px;cursor:pointer}
.side{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#fff;z-index:100;transition:.3s;padding:20px;box-shadow:0 0 20px #0002}
.side.open{left:0}
.side a{display:block;padding:14px 10px;text-decoration:none;color:#4a2a2a;border-bottom:1px solid #ffeaef;font-size:14px;letter-spacing:1px}
.container{max-width:1100px;margin:0 auto;padding:18px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:10px 0 16px;white-space:nowrap;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros button{padding:8px 16px;border-radius:20px;border:1px solid #ffbfd0;background:#fff;color:#b07a7a;font-size:12px;letter-spacing:1px;cursor:pointer;flex-shrink:0}
.filtros button.active{background:#ff6b8a;color:#fff;border-color:#ff6b8a;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #0001;position:relative}
.card img{width:100%;height:190px;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;padding:4px 9px;border-radius:20px;color:#fff;font-size:9px;font-weight:700;letter-spacing:1px}
.oferta{background:#ff6b8a} .agotado{background:#333}
.info{padding:10px 10px 12px} .info b{font-size:13px;color:#4a2a2a}
.info .desc{font-size:10px;color:#8a6a6a;display:block;margin:3px 0}
.info .mat{font-size:8px;background:#ffeaef;padding:2px 6px;border-radius:10px;color:#b07a7a;letter-spacing:1px}
.price{color:#ff6b8a;font-weight:700;font-size:13px;margin-top:4px;display:block} .old{color:#bbb;text-decoration:line-through;font-size:10px;margin-left:5px}
.btn{display:block;margin-top:8px;background:#4a2a2a;color:#fff;text-align:center;padding:9px;border-radius:10px;text-decoration:none;font-size:11px;letter-spacing:1px;font-weight:600}
.btn.agotado{background:#ccc;pointer-events:none}
</style>
</head>
<body>
<div class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</div>
<div class="side" id="side"><div style="text-align:right;font-size:22px;cursor:pointer" onclick="side.classList.remove('open')">✕</div>
<h3 style="font-family:serif;letter-spacing:4px;color:#ff6b8a">VALE&LIA</h3>
<a href="#" onclick="side.classList.remove('open')">✨ INICIO</a>
<a href="#" onclick="side.classList.remove('open')">💎 CATÁLOGO</a>
<a href="https://wa.me/526391776566" target="_blank">💬 WHATSAPP 6391776566</a>
<a href="admin.html">🔒 ADMIN</a>
</div>

<div class="header">
<h1>VALE & LIA</h1>
<p class="sub">accesorios y mas</p>
<p class="slogan">✦ BRILLA CON VALE&LIA ✦<br>ORO LAMINADO · PLATA · ACERO INOXIDABLE · CHAPA DE ORO</p>
</div>

<div class="container">
<div class="filtros" id="filtros">
<button class="active" onclick="filtrar('todo',this)">TODO</button>
<button onclick="filtrar('anillo',this)">ANILLO</button>
<button onclick="filtrar('collar',this)">COLLAR</button>
<button onclick="filtrar('pulso',this)">PULSO / PULSERA</button>
<button onclick="filtrar('arete',this)">ARETES</button>
<button onclick="filtrar('oferta',this)">OFERTAS</button>
</div>
<div id="grid" class="grid"></div>
<p id="loading" style="text-align:center;color:#c89;padding:30px">Cargando joyería rosa...</p>
</div>

<script>
const BIN_ID = "PEGA_AQUI_TU_BIN_ID";
const API_KEY = "PEGA_AQUI_TU_MASTER_KEY";
const WHATSAPP = "526391776566";
let TODOS = [];

async function load(){
  try{
    if(BIN_ID.includes('PEGA_AQUI')){
      TODOS = JSON.parse(localStorage.getItem('vale_lia_prods')||'[]');
      render(TODOS); return;
    }
    const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{'X-Master-Key':API_KEY}});
    const d = await r.json();
    TODOS = d.record||[];
    render(TODOS);
  }catch(e){ loading.innerText='Agrega tu BIN ID en el código'; }
}
function render(prods){
  loading.style.display='none';
  if(prods.length==0){ grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#c89">Aún no hay productos, agrega en tu admin</p>'; return; }
  grid.innerHTML = prods.map(p=>{
    const agot = p.status=='agotado';
    const ofe = p.isOffer || p.status=='oferta' || p.offerPrice;
    const badge = agot?'<div class="badge agotado">AGOTADO</div>':ofe?'<div class="badge oferta">OFERTA</div>':'';
    return `<div class="card">${badge}<img src="${p.img}"><div class="info"><b>${p.name}</b><span class="desc">${p.desc||''}</span><span class="mat">${(p.categoria||p.material||'').toUpperCase()}</span><span class="price">${p.offerPrice||p.price}${p.offerPrice?`<span class="old">${p.price}</span>`:''}</span><a class="btn ${agot?'agotado':''}" href="https://wa.me/${WHATSAPP}?text=Hola! Me interesa ${encodeURIComponent(p.name)}" target="_blank">${agot?'NO DISPONIBLE':'PEDIR WHATSAPP'}</a></div></div>`;
  }).join('');
}
function filtrar(cat,btn){
  document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(cat=='todo') return render(TODOS);
  if(cat=='oferta'){ render(TODOS.filter(p=>p.isOffer||p.status=='oferta'||p.offerPrice)); return; }
  render(TODOS.filter(p=>{
    let texto = (p.name+' '+(p.categoria||'')+' '+(p.desc||'')).toLowerCase();
    return texto.includes(cat);
  }));
}
load();
</script>
</body>
</html>
