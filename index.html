body{margin:0;background:#fffffe;font-family:'Montserrat',sans-serif;color:#3d2424}
.header{background:#ffeaef;padding:55px 20px 35px;text-align:center}

.filtros-menu button.active{background:#3d2424;color:#fff;border-color:#3d2424}
.container{max-width:1100px;margin:0 auto;padding:0 14px 30px;background:#fffffe}
.current{font-size:9px;letter-spacing:4px;color:#b09090;text-align:center;margin:24px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:4px;overflow:hidden;border:1px solid #f6ecec;position:relative}
.card img{width:100%;height:210px;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;padding:4px 10px;color:#fff;font-size:7px;letter-spacing:1px}
.oferta{background:#3d2424} .agotado{background:#bbb}
.info{padding:12px} .info b{font-family:'Cormorant Garamond',serif;font-size:14px;color:#3d2424;font-weight:600}

.price{font-family:'Cormorant Garamond',serif;color:#3d2424;font-weight:600;margin-top:6px;display:block} .old{font-family:'Montserrat';color:#bbb;text-decoration:line-through;font-size:10px;margin-left:5px}
.btn{display:block;margin-top:10px;border:1px solid #3d2424;color:#3d2424;text-align:center;padding:9px;text-decoration:none;font-size:9px;letter-spacing:2px;transition:.3s}
.btn:hover{background:#3d2424;color:#fff}
.btn.agotado{border-color:#e0e0e0;color:#bbb;pointer-events:none}
</style>
</head>
