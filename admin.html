<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin VALE&LIA</title>
<style>body{margin:0;background:#fdf6f2;font-family:system-ui;padding:15px}.box{max-width:520px;margin:0 auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 20px #0001}input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd;font-size:14px}button{width:100%;padding:13px;background:#5a3a3a;color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:8px;cursor:pointer}img#prev{width:100%;height:280px;object-fit:cover;border-radius:8px;display:none;margin-top:8px}.row{display:flex;gap:8px}.row>div{flex:1}</style></head><body>
<div class="box" id="log"><h2 style="text-align:center;font-family:serif;letter-spacing:4px;color:#5a3a3a">VALE & LIA ADMIN</h2><input type="password" id="pass" placeholder="Contraseña valelia1234"><button onclick="if(pass.value=='valelia1234'){log.style.display='none';adm.style.display='block';cargar()}else{alert('Mal')}">Entrar</button></div>
<div class="box" id="adm" style="display:none"><h3>Agregar Producto - Se ve en la nube al instante</h3><input type="file" id="file" accept="image/*"><img id="prev"><input id="name" placeholder="Nombre * Ej: Aretes corazón"><div class="row"><div><input id="price" placeholder="Precio * $120"></div><div><input id="offerPrice" placeholder="Oferta $85 (opcional)"></div></div><textarea id="desc" placeholder="Descripción"></textarea><div class="row"><div><select id="material"><option>Acero inoxidable</option><option>Chapa de oro</option><option>Oro laminado</option><option>Plata 925</option><option>Otro</option></select></div><div><select id="status"><option value="disponible">Disponible</option><option value="oferta">Oferta</option><option value="agotado">Agotado</option></select></div></div><label><input type="checkbox" id="isOffer" style="width:auto"> Marcar como oferta</label><button onclick="guardar()">💾 Guardar en Nube (todas lo ven)</button><div id="lista" style="margin-top:15px"></div><a href="index.html" style="display:block;text-align:center;margin-top:15px;color:#5a3a3a">Ver catálogo elegante</a></div>
<script>
const BIN_ID="PEGA_AQUI_TU_BIN_ID"; const API_KEY="PEGA_AQUI_TU_MASTER_KEY"; let imgData=''; let productos=[];
file.onchange=e=>{let r=new FileReader(); r.onload=x=>{imgData=x.target.result; prev.src=imgData; prev.style.display='block'}; r.readAsDataURL(e.target.files[0])};
async function cargar(){let res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{'X-Master-Key':API_KEY}}); let d=await res.json(); productos=d.record||[]; render()}
async function guardar(){if(!name.value||!price.value||!imgData){alert('Falta nombre, precio o foto');return} productos.unshift({name:name.value,price:price.value,offerPrice:offerPrice.value,desc:desc.value,material:material.value,status:status.value,isOffer:isOffer.checked,img:imgData,id:Date.now()}); let res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(productos)}); if(res.ok){alert('¡Guardado! Tus clientas ya lo ven'); name.value='';price.value='';offerPrice.value='';desc.value='';imgData='';prev.style.display='none';file.value=''; render()}else{alert('Error API Key')} }
function render(){lista.innerHTML=productos.map((p,i)=>`<div style="display:flex;gap:8px;align-items:center;border:1px solid #eee;padding:6px;border-radius:8px;margin-top:8px"><img src="${p.img}" style="width:45px;height:45px;object-fit:cover;border-radius:6px"><div style="flex:1"><b>${p.name}</b><br><small>${p.price} ${p.offerPrice?'->'+p.offerPrice:''}</small></div><button onclick="borrar(${i})" style="width:auto;background:#b85c5c;padding:5px 10px">X</button></div>`).join('')}
async function borrar(i){if(!confirm('¿Borrar?'))return; productos.splice(i,1); await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(productos)}); render()}
</script></body></html>
